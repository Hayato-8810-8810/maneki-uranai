<style>
:root{
  --bg:#F6F4FA; --surface:#FDFCFF; --ink:#221C3A; --muted:#6B6582; --line:#E2DDEE;
  --gold:#9A6E1C; --gold-soft:#F3E8CF; --plum:#5E3A93; --plum-soft:#ECE4F7; --on-plum:#FFFFFF;
  --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#14112A; --surface:#1E1A38; --ink:#EDE8F7; --muted:#A9A2C2; --line:#332D55;
    --gold:#E2B659; --gold-soft:#3A3020; --plum:#B99AF0; --plum-soft:#2B2450; --on-plum:#14112A; color-scheme:dark;}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.85;letter-spacing:.02em;word-break:auto-phrase;padding-inline:16px;padding-block:40px 56px}
img{max-width:100%}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:40px}
h1,h2{font-family:var(--display);font-weight:800;line-height:1.4;letter-spacing:.04em;margin:0;text-wrap:balance}
p{margin:0}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.brand img{width:112px;height:112px;border-radius:50%}
.brand h1{font-size:clamp(34px,9vw,48px)}
.brand p{color:var(--plum);font-weight:700}
.sec-title{font-size:13px;letter-spacing:.18em;color:var(--gold);font-weight:700}
.list{display:flex;flex-direction:column;gap:16px}
.item{display:flex;flex-direction:column;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;color:inherit;text-decoration:none}
.item:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.item .tag{align-self:flex-start;font-size:12px;font-weight:700;color:var(--gold);background:var(--gold-soft);border-radius:99px;padding:0 12px}
.item h2{font-size:clamp(24px,6.5vw,30px)}
.item p{color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.strip img{width:100%;height:auto;aspect-ratio:1;border-radius:50%}
.go{align-self:flex-start;background:var(--plum);color:var(--on-plum);font-weight:700;border-radius:8px;padding:12px 24px}
.soon{border:1px dashed var(--muted);border-radius:16px;padding:16px 24px;color:var(--muted);font-size:14px;text-align:center}
.sns{display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
.sns a{color:var(--plum);font-weight:700}
.note{font-size:12px;color:var(--muted);line-height:1.7;text-align:center}
</style>
</head>
